<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Arnav Brand — Light an Idea</title>
  <desc id="desc">Original illustration inspired by vintage Indian matchbox labels: saturated red, cobalt, saffron, and green printing surround a stylized flame and vinyl record.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e8d2a6"/>
      <circle cx="3" cy="5" r="0.8" fill="#a88455" opacity=".5"/>
      <circle cx="13" cy="12" r="0.7" fill="#a88455" opacity=".45"/>
    </pattern>
    <pattern id="teeth" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 0l13 13L26 0M0 26l13-13 13 13" fill="none" stroke="#f2bd40" stroke-width="5"/>
    </pattern>
    <g id="star" fill="#eab946" stroke="#17223d" stroke-width="3">
      <path d="M0-20L6-6 20 0 6 6 0 20-6 6-20 0-6-6Z"/>
    </g>
    <g id="flower" stroke="#17223d" stroke-width="3">
      <circle cy="-13" r="9" fill="#f3c54e"/><circle cx="13" r="9" fill="#f3c54e"/>
      <circle cy="13" r="9" fill="#f3c54e"/><circle cx="-13" r="9" fill="#f3c54e"/>
      <circle r="10" fill="#d0372c"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <path d="M0 62H1200M0 568H1200" stroke="#17223d" stroke-width="7"/>
  <path d="M10 18h145M1045 18h145M10 612h145M1045 612h145" stroke="#d0372c" stroke-width="12"/>
  <g font-family="Georgia, Times New Roman, serif" font-weight="bold" fill="#17223d">
    <text x="48" y="42" font-size="19" letter-spacing="3">MATCH No. 001</text>
    <text x="1152" y="42" font-size="19" text-anchor="end" letter-spacing="3">IDEAS • MUSIC • CODE</text>
    <text x="48" y="602" font-size="19" letter-spacing="2">ORIGINAL MAKE / ARNAV</text>
    <text x="1152" y="602" font-size="19" text-anchor="end" letter-spacing="2">STRIKE FOR INSPIRATION</text>
  </g>

  <g transform="translate(56 129)">
    <rect x="8" y="8" width="148" height="369" fill="#17223d"/>
    <rect width="148" height="369" fill="#166d60" stroke="#17223d" stroke-width="6"/>
    <rect x="17" y="17" width="114" height="335" fill="none" stroke="#f3c54e" stroke-width="4"/>
    <use href="#flower" x="74" y="68"/>
    <use href="#star" x="74" y="167"/>
    <use href="#flower" x="74" y="265"/>
    <text x="74" y="327" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="20" text-anchor="middle" fill="#fff1cf">BUILD</text>
  </g>

  <rect x="236" y="98" width="750" height="475" fill="#17223d"/>
  <rect x="221" y="83" width="750" height="475" fill="#cc352c" stroke="#17223d" stroke-width="8"/>
  <rect x="238" y="100" width="716" height="441" fill="url(#teeth)" stroke="#f2bd40" stroke-width="5"/>
  <rect x="263" y="124" width="666" height="393" fill="#f5d75e" stroke="#17223d" stroke-width="6"/>

  <rect x="278" y="139" width="636" height="89" fill="#1e4590" stroke="#17223d" stroke-width="4"/>
  <text x="596" y="162" font-family="Georgia, Times New Roman, serif" font-weight="bold" font-size="17" text-anchor="middle" letter-spacing="6" fill="#fff1cf">ORIGINAL • SMALL BATCH</text>
  <text x="596" y="216" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="58" text-anchor="middle" letter-spacing="5" fill="#fff1cf">ARNAV BRAND</text>

  <rect x="278" y="240" width="636" height="194" fill="#fff1cf" stroke="#17223d" stroke-width="4"/>
  <path d="M290 256h612M290 418h612" stroke="#d0372c" stroke-width="5"/>
  <use href="#star" x="322" y="284"/><use href="#star" x="870" y="284"/>
  <use href="#star" x="322" y="392"/><use href="#star" x="870" y="392"/>
  <text x="353" y="348" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e4590">CODE</text>
  <text x="840" y="348" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e4590">SOUND</text>

  <!-- A small vinyl record sits behind the flame: both interests in one emblem. -->
  <circle cx="596" cy="338" r="79" fill="#1e4590" stroke="#17223d" stroke-width="7"/>
  <circle cx="596" cy="338" r="58" fill="none" stroke="#f4c850" stroke-width="5"/>
  <circle cx="596" cy="338" r="42" fill="none" stroke="#f4c850" stroke-width="4"/>
  <path d="M596 401c-52-29-48-66-21-92-4 26 19 27 19 2 13-20 14-33 8-44 49 36 65 89 24 127-7 7-18 12-30 16Z" fill="#d0372c" stroke="#17223d" stroke-width="5"/>
  <path d="M595 398c-18-15-18-31-3-48 0 11 11 15 17 4 11 21 5 38-14 44Z" fill="#f4c850"/>

  <rect x="278" y="445" width="636" height="56" fill="#166d60" stroke="#17223d" stroke-width="4"/>
  <text x="596" y="487" font-family="Arial Black, Impact, sans-serif" font-size="37" font-weight="900" text-anchor="middle" letter-spacing="6" fill="#fff1cf">LIGHT AN IDEA.</text>

  <g transform="translate(995 129)">
    <rect x="8" y="8" width="148" height="369" fill="#17223d"/>
    <rect width="148" height="369" fill="#1e4590" stroke="#17223d" stroke-width="6"/>
    <rect x="17" y="17" width="114" height="335" fill="none" stroke="#f3c54e" stroke-width="4"/>
    <use href="#star" x="74" y="68"/>
    <use href="#flower" x="74" y="167"/>
    <use href="#star" x="74" y="265"/>
    <text x="74" y="327" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="20" text-anchor="middle" fill="#fff1cf">LISTEN</text>
  </g>
</svg>

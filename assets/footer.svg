<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 76" width="960" height="76" role="img" aria-labelledby="title desc"><title id="title">End of profile. Not end of game. Continue? Always.</title><desc id="desc"></desc><rect width="960" height="76" rx="10" fill="#0c0d16"/><text x="28" y="44" fill="#a4a7bd" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" letter-spacing="1">END OF PROFILE ≠ END OF GAME</text><text x="930" y="44" fill="#dcff70" font-size="14" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="end" letter-spacing="1">CONTINUE?  ALWAYS.</text></svg>

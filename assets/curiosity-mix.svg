<g font-family="Arial, Helvetica, sans-serif" fill="#f9e7be">
<text x="52" y="60" font-size="19" font-weight="700" letter-spacing="3">ARNAV DESHPANDE</text>
<text x="654" y="60" text-anchor="end" font-size="13" letter-spacing="2">THE CURIOSITY MIX / VOL. 01</text>
<text x="1148" y="60" text-anchor="end" font-size="14" letter-spacing="2">INDEPENDENT IDEAS. IN STEREO.</text>
<text x="51" y="126" font-size="15" letter-spacing="4" fill="#efb647">APPLIED AI / BACKEND / FULL-STACK</text>
<g font-family="Impact, 'Arial Narrow', sans-serif" font-weight="900" letter-spacing="-3">
<text x="55" y="231" font-size="98" fill="#e64b2f">CURIOSITY</text><text x="50" y="225" font-size="98">CURIOSITY</text>
<text x="55" y="334" font-size="98" fill="#e64b2f">ON REPEAT.</text><text x="50" y="328" font-size="98">ON REPEAT.</text></g>
<text x="54" y="379" font-size="23">Real problems. A little rhythm. A lot of building.</text>
<text x="54" y="409" font-size="15" letter-spacing="2" fill="#efb647">DROP THE NEEDLE. EXPLORE THE WORK. ↓</text>
<text x="54" y="461" font-size="15" font-weight="700" letter-spacing="2">MADE IN MUMBAI</text>
<text x="654" y="461" text-anchor="end" font-size="14" letter-spacing="2">CODE / CRICKET / CURIOSITY</text>
<text x="1148" y="461" text-anchor="end" font-size="14" letter-spacing="2">SIDE A: BUILD · SIDE B: EXPLORE</text></g>

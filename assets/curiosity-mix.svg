<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Arnav Deshpande — The Curiosity Mix</title>
<desc id="desc">An animated record sleeve. Curiosity on repeat. Applied AI, backend, full-stack. Made in Mumbai.</desc>
<defs>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f9e7be" opacity=".12"/></pattern>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V9" stroke="#f9e7be" stroke-width="2" opacity=".2"/></pattern>
<path id="star" d="M0-16 5-5 16 0 5 5 0 16-5 5-16 0-5-5Z"/>
<style>
.spin{transform-origin:930px 255px;animation:turn 22s linear infinite}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:beat 1.2s ease-in-out infinite alternate}
.b2{animation-delay:-.4s}.b3{animation-delay:-.9s}.b4{animation-delay:-.2s}.b5{animation-delay:-.6s}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes beat{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.spin,.bar{animation:none}}
</style></defs>
